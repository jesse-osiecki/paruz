# paruz configuration (annotated default)
#
# System file:  /etc/paruz/paruz.conf
# User override: ${XDG_CONFIG_HOME:-~/.config}/paruz/paruz.conf
# Sourced as Bash KEY=value. See PLAN.md §9.

# aur-scan static-analysis gate: stop the build if any finding is at or above
# this severity. One of: critical high medium low info. Findings at/above this
# level require an explicit override to proceed (see ALLOW_SCAN_FINDINGS).
FAIL_ON=critical

# Warn (but do not block) at or above this severity.
WARN_ON=high

# Pre-approve aur-scan findings at/above FAIL_ON without the interactive
# override prompt. 0 = default: an interactive run prompts to override (default
# No), a non-interactive run fails closed. Set to 1 only for automation that has
# already reviewed the findings. Some aur-scan rules false-positive on benign
# metadata (e.g. the string 'sudo' in an optdepends description).
ALLOW_SCAN_FINDINGS=0

# Build backend. chroot = makechrootpkg + network-off namespace (default).
# gvisor = Phase 2 (see PLAN.md §13); not implemented yet.
SANDBOX=chroot

# Pre-approve a networked build (waives I2) without the auto-detect prompt.
# 0 = default: the build has NO network (I2); for packages that fetch their own
# build deps (cargo/go/npm/pip/…) paruz auto-detects and prompts to allow a
# networked build. Set to 1 to always allow it (for automation). A networked
# build is still chroot- and secret-isolated (I3), gated, and installed with
# --noscriptlet — but build()/package() have network, so it is a conscious,
# per-package downgrade of the network-off guarantee. See PLAN.md §6.3/§10.
ALLOW_BUILD_NET=0

# Hard-stop when a package's AUR maintainer has changed since last approval
# (the orphan-adoption takeover vector). 0 = stop and require --allow-maintainer-change.
ALLOW_MAINTAINER_CHANGE=0

# Fold `flatpak update` into full upgrades (paruz -Syu). 1 = yes.
FLATPAK=1

# Run the IOC self-check (eBPF rootkit maps + known-compromised packages). 1 = yes.
IOC=1

# Allow a networked re-run of check() only (weakens the network-off guarantee for
# test suites that require the network). 0 = keep check() offline.
ALLOW_CHECK_NET=0

# Path to the known-compromised package list used by the IOC self-check.
KNOWN_BAD_LIST=/usr/share/paruz/known-bad-packages.txt
